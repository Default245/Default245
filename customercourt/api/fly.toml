# Fly.io config for the customercourt app (region: ams).
# Deploy from this directory: `fly deploy`
#
# Required secrets (fly secrets set KEY=value):
#   DATABASE_URL        — from customercourt-db (or `fly postgres attach customercourt-db`)
#   REDIS_URL           — from customercourt-redis (Upstash, rediss://...)
#   ANTHROPIC_API_KEY   — AI pipeline
#   STRIPE_SECRET_KEY   — bank linking + refund verification (optional)

app = "customercourt"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"

[processes]
  api = "node dist/server.js"
  worker = "node dist/worker.js"

[http_service]
  processes = ["api"]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Workers consume queues and run the SLA scheduler — they must not scale to
# zero, or follow-ups and escalations silently stop.
[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
